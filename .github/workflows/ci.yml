name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and macOS builds
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          node --version
      - name: Documentation tools
        run: npm ci
      - name: Unit tests and lint
        run: make check
      - name: Universal development app
        run: |
          make universal
          lipo "dist/Power Watcher.app/Contents/MacOS/PowerWatcher" -verify_arch arm64
          lipo "dist/Power Watcher.app/Contents/MacOS/PowerWatcher" -verify_arch x86_64
          make package
      - name: Unsigned sandboxed Xcode archive
        run: ./scripts/archive.sh --unsigned
      - name: Upload development build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PowerWatcher-development
          path: |
            dist/PowerWatcher-*-development.zip
            dist/PowerWatcher-*-development.zip.sha256
          if-no-files-found: error
          retention-days: 14
